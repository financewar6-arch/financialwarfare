name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        run: |
          # Get the latest commit SHA
          COMMIT_SHA=${{ github.sha }}
          echo "Triggering deployment for commit: $COMMIT_SHA"

          # Use Render API to trigger deployment
          # Note: This requires RENDER_API_KEY to be set as a GitHub secret
          if [ ! -z "${{ secrets.RENDER_API_KEY }}" ]; then
            curl -X POST "https://api.render.com/v1/services/srv-d9sba0v10e5c739jq1s0/deploys" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"clearCache\": true}" || echo "API deployment failed, trying webhook method"
          fi

          # Alternative: If deploy hook is configured, use it
          if [ ! -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Using deploy hook..."
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" || echo "Deploy hook method failed"
          fi

          echo "Deployment trigger completed"

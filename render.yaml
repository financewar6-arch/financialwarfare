services:
  - type: web
    name: financial-warfare
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        scope: all
        sync: false
      - key: NEXT_PUBLIC_API_URL
        scope: all
      - key: FINNHUB_API_KEY
        scope: all
        sync: false
      - key: NEWSAPI_KEY
        scope: all
        sync: false
      - key: CRON_SECRET
        scope: all
        sync: false
      - key: HEALTH_CHECK_SECRET
        scope: all
        sync: false
      - key: GOLD_API_KEY
        scope: all
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        scope: all
        sync: false
      - key: NEXTAUTH_SECRET
        scope: all
        sync: false
      - key: ANTHROPIC_API_KEY
        scope: all
        sync: false
      - key: YOUTUBE_API_KEY
        scope: all
        sync: false
      - key: TIKTOK_API_KEY
        scope: all
        sync: false
      - key: WEBSITE_API_TOKEN
        scope: all
        sync: false
      - key: ADMIN_EMAILS
        scope: all
        sync: false

crons:
  # Live Price Updates - Every Hour
  - id: hourly-prices
    command: "curl -X POST $RENDER_EXTERNAL_URL/api/cron/hourly-prices -H 'Authorization: Bearer $CRON_SECRET'"
    schedule: "0 * * * *"

  # Daily Editorial & Analysis - Market Close (5 PM ET)
  - id: daily-update
    command: "curl -X POST $RENDER_EXTERNAL_URL/api/cron/daily-update -H 'Authorization: Bearer $CRON_SECRET'"
    schedule: "0 21 * * *"
    notifications:
      web_hook:
        url: $SLACK_WEBHOOK_URL
